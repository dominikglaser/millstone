[tab LFO / VOICE]
frame x=10 y=92 w=560 h=300 title="VOICE"
knob cx=90 cy=240 r=36 label="VOICES" key=voices bw=110
enum_h cx=270 cy=170 sw=70 label="MODE" key=voice_mode
knob cx=270 cy=300 r=28 label="GLIDE" key=glide bw=110
knob cx=430 cy=240 r=32 label="OSC MOD" key=vibrato bw=90
knob cx=525 cy=240 r=32 label="NOISE" key=noise bw=88
