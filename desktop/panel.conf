knob cx=1170 cy=446 r=38 label="VOLUME" key=volume
enum_v cx=1352 cy=438 sw=72 sh=26 label="MODE" key=vca_mode
knob cx=1254 cy=534 r=20 label="VEL > AMP" key=vel_amp
knob cx=1352 cy=534 r=20 label="VEL > VCF" key=vel_filt

frame x=48 y=602 w=570 h=250 title="LFO"
enum_h cx=333 cy=660 sw=74 sh=28 label="SHAPE" key=lfo_shape
knob cx=128 cy=752 r=38 label="RATE" key=lfo_rate when=lfo_sync:OFF
popup cx=138 cy=752 w=156 h=38 label="DIVISION" key=lfo_div when=lfo_sync:ON
toggle cx=268 cy=720 label="RETRIG" key=lfo_retrig
toggle cx=344 cy=720 label="SYNC" key=lfo_sync
enum_h cx=306 cy=810 sw=62 sh=26 label="PHASE" key=lfo_lock when=lfo_sync:ON
knob cx=468 cy=752 r=26 label="WHEEL > LFO" key=wheel_lfo
knob cx=562 cy=752 r=26 label="AT > LFO" key=at_lfo

frame x=628 y=602 w=410 h=250 title="VOICE"
