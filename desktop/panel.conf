# Millstone desktop panel: one screen, 1480 x 864. The MPC keeps vst/layout.conf; this file is the desktop only.
# Kinds: frame, knob, fader, enum_h, enum_v, toggle, popup, button. when=key:OPTION shows a control conditionally.

frame x=48 y=84 w=454 h=250 title="OSCILLATOR 1"
toggle cx=86 cy=134 label="ON" key=o1_on
button cx=140 cy=134 label="-" key=o1_prev
popup cx=284 cy=134 w=236 h=38 key=o1_engine cols=3
button cx=428 cy=134 label="+" key=o1_next
knob cx=110 cy=199 r=27 label="HARMONICS" key=o1_harm
knob cx=200 cy=199 r=27 label="TIMBRE" key=o1_timbre
knob cx=290 cy=199 r=27 label="MORPH" key=o1_morph
knob cx=370 cy=190 r=17 label="OCTAVE" key=o1_oct
knob cx=424 cy=190 r=17 label="SEMI" key=o1_semi
knob cx=476 cy=190 r=17 label="FINE" key=o1_fine
knob cx=92 cy=282 r=17 label="FM ENV" key=o1_fm
knob cx=160 cy=282 r=17 label="TIMBRE CV" key=o1_timbre_mod
knob cx=228 cy=282 r=17 label="MORPH CV" key=o1_morph_mod
enum_v cx=304 cy=289 sw=58 sh=22 label="CV SOURCE" key=o1_cv_src
knob cx=396 cy=282 r=20 label="LEVEL" key=o1_level
knob cx=460 cy=282 r=20 label="VC MIX" key=o1_mix

