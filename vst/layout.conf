# Millstone MPC skin: a semi-modular style panel. Shadow coordinates (skin y = y - 86), 1280 wide,
# controls kept left of x~1010 (MPC's Q-Link sidebar). One qlinks line per tab, most-turned first.

theme_bg=16181c
theme_panel=24272d
theme_line=4b5058
theme_accent=e8a33a
theme_accent_hi=ffffff
theme_ink=ece9e2
theme_ink_dim=9aa0a8
theme_knob_face=3a3d45
theme_knob_ring=1b1d22
theme_knob_dot=e8a33a
theme_btn_text=16181c

[tab OSC 1]
frame x=10 y=92 w=570 h=616 title="OSCILLATOR 1"
toggle cx=62 cy=152 label="ON" key=o1_on bw=84
button cx=150 cy=152 label="-" key=o1_prev
popup cx=330 cy=152 w=270 h=48 label="MODEL" key=o1_engine cols=3 cw=240
button cx=510 cy=152 label="+" key=o1_next
knob cx=115 cy=330 r=48 label="HARMONICS" key=o1_harm
knob cx=295 cy=330 r=48 label="TIMBRE" key=o1_timbre
knob cx=475 cy=330 r=48 label="MORPH" key=o1_morph
knob cx=115 cy=540 r=34 label="FM (ENV)" key=o1_fm
knob cx=295 cy=540 r=34 label="TIMBRE CV" key=o1_timbre_mod
knob cx=475 cy=540 r=34 label="MORPH CV" key=o1_morph_mod
frame x=596 y=92 w=420 h=616 title="PITCH / OUT"
knob cx=700 cy=230 r=34 label="OCTAVE" key=o1_oct
knob cx=912 cy=230 r=34 label="SEMI" key=o1_semi
knob cx=700 cy=420 r=34 label="FINE" key=o1_fine
knob cx=912 cy=420 r=34 label="LEVEL" key=o1_level
knob cx=806 cy=600 r=34 label="VC MIX" key=o1_mix
text cx=1150 cy=160 label="MILLSTONE" size=2.2 color=e8a33a
text cx=1150 cy=200 label="HYBRID POLY" size=1.3 color=8a8f98
text cx=1150 cy=300 label="FM: ENV > PITCH" size=1.1 color=8a8f98
text cx=1150 cy=330 label="CV: LFO AMOUNT" size=1.1 color=8a8f98
text cx=1150 cy=360 label="VC MIX: OUT > AUX" size=1.1 color=8a8f98
qlinks "OSC 1" = o1_harm,o1_timbre,o1_morph,o1_fm,o1_level,o1_mix,o1_fine,o1_semi,o1_timbre_mod,o1_morph_mod,o1_oct,o1_engine,o1_on

