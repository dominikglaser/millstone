# The drawer, below the panel: a module strip (page= picks TIDES, CLOCK, DELAY or FX, channel= the clock output), then the patch bay.
# The strip's selector sits where a frame's title would, so this frame has none.
# A jack's index is its option number in cN_src / cN_dst.
