knob cx=682 cy=752 r=24 label="VOICES" key=voices
knob cx=782 cy=752 r=24 label="GLIDE" key=glide
knob cx=882 cy=752 r=24 label="OSC MOD" key=vibrato
knob cx=982 cy=752 r=24 label="NOISE" key=noise

frame x=1048 y=602 w=382 h=250 title="MODULATION / LPG"
